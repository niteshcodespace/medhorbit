# Local development database only. Credentials are for local use, not production.
services:
  postgres:
    image: postgres:16
    container_name: medhorbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medhorbit
      POSTGRES_USER: medhorbit
      POSTGRES_PASSWORD: medhorbit_dev
    ports:
      # Host 5433 avoids clashing with other local PostgreSQL instances on 5432.
      - "5433:5432"
    volumes:
      - medhorbit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhorbit -d medhorbit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medhorbit_pgdata:
